<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古报纸 OCR 识别与智能总结 - 演示系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deepest: #05070C;
            --bg-deep: #0A0D12;
            --bg-mid: #0F131C;
            --bg-elevated: #161D2B;
            --bg-highest: #1E2636;
            --accent: #38BDF8;
            --accent-dim: #1E3A5F;
            --text-primary: #E8EDF5;
            --text-secondary: #9BA5B8;
            --text-dim: #6B7280;
            --success: #6EE7B7;
            --warning: #E9A568;
            --error: #EF4444;
            --border: #2A3441;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-deepest);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: clamp(1rem, 3vw, 2rem);
        }

        header {
            text-align: center;
            padding: clamp(2rem, 5vw, 4rem) 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: clamp(2rem, 4vw, 3rem);
        }

        h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: clamp(0.875rem, 2vw, 1rem);
        }

        .upload-zone {
            background: var(--bg-deep);
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: clamp(2rem, 5vw, 4rem);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: var(--bg-mid);
        }

        .upload-zone.dragover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.6;
        }

        #fileInput {
            display: none;
        }

        .btn {
            background: var(--accent);
            color: var(--bg-deepest);
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(56, 189, 248, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .module-card {
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .module-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 24px rgba(56, 189, 248, 0.2);
        }

        .module-card.completed {
            border-color: var(--success);
        }

        .module-card.error {
            border-color: var(--error);
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .module-title {
            font-size: 1.125rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .module-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .module-status.pending { background: var(--text-dim); }
        .module-status.processing {
            background: var(--accent);
            animation: pulse 2s infinite;
        }
        .module-status.completed { background: var(--success); }
        .module-status.error { background: var(--error); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .module-content {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-elevated);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
            width: 0%;
        }

        .results-section {
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            margin-top: 2rem;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .result-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            font-size: 0.9375rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--accent);
            background: var(--bg-mid);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .export-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .export-btn {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 0.625rem 1.25rem;
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .export-btn:hover {
            border-color: var(--accent);
            background: var(--bg-highest);
        }

        .quality-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .metric-card {
            background: var(--bg-mid);
            padding: 1rem;
            border-radius: 8px;
        }

        .metric-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .summary-text {
            background: var(--bg-mid);
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            line-height: 1.8;
            margin-top: 1rem;
        }

        .ocr-text-box {
            background: var(--bg-mid);
            padding: 1.5rem;
            border-radius: 8px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--bg-elevated);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-elevated);
            color: var(--text-primary);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗞️ 古报纸 OCR 识别与智能总结</h1>
            <p class="subtitle">基于 PaddleOCR 的端到端处理系统 · 演示版</p>
        </header>

        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📄</div>
            <h3>点击或拖拽上传报纸图像</h3>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">支持 PDF, PNG, JPG 格式</p>
            <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" />
        </div>

        <div style="text-align: center; margin-bottom: 2rem;">
            <button class="btn" id="processBtn" disabled>开始处理</button>
        </div>

        <div class="modules-grid" id="modulesGrid">
            <!-- 模块卡片将通过 JS 动态生成 -->
        </div>

        <div class="results-section" id="resultsSection">
            <h2 style="margin-bottom: 1.5rem;">📊 处理结果</h2>

            <div class="result-tabs">
                <button class="tab-btn active" data-tab="ocr">OCR文本</button>
                <button class="tab-btn" data-tab="summary">AI总结</button>
                <button class="tab-btn" data-tab="quality">质量报告</button>
            </div>

            <div class="tab-content active" id="tab-ocr">
                <div class="ocr-text-box" id="ocrText">等待处理...</div>
                <div class="export-buttons">
                    <button class="export-btn" data-format="markdown">📝 导出 Markdown</button>
                    <button class="export-btn" data-format="html">🌐 导出 HTML</button>
                    <button class="export-btn" data-format="json">📋 导出 JSON</button>
                </div>
            </div>

            <div class="tab-content" id="tab-summary">
                <div class="summary-text" id="summaryText">等待生成...</div>
            </div>

            <div class="tab-content" id="tab-quality">
                <div class="quality-metrics" id="qualityMetrics">
                    <!-- 质量指标将动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/static/js/demo.js"></script>
</body>
</html>
